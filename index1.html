<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Card UI Design srrs</title>

    <link rel="stylesheet" href="style1.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>
<body>

<div class="profile-card">

    <div class="card">
        <div class="image">
            <img src="img/srrr.jpg"
                 alt="Profile Image"
                 class="profile-img">
        </div>
    </div>

    <div class="text-data">
        <span class="name">CodingLab</span>
        <span class="job">YouTuber & Blogger</span>
    </div>

    <div class="media-buttons">
        <a href="#" style="background:#1877F2 ;" class="link"><i class="fa-brands fa-facebook"></i></a>
        <a href="#" style="background: #1DA1F2;" class="link"><i class="fa-brands fa-twitter"></i></a>
        <a href="#" style="background: #e1306c;;" class="link"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" style="background: #FF0000;" class="link"><i class="fa-brands fa-youtube"></i></a>
    </div>

    <div class="buttons">
        <button class="button">Subscribe</button>
        <button class="button">Message</button>
    </div>

    <div class="analytics">
        <div class="data">
            <i class="fa-regular fa-heart"></i>
            <span class="number">60k</span>
        </div>

        <div class="data">
            <i class="fa-regular fa-comment"></i>
            <span class="number">20k</span>
        </div>

        <div class="data">
            <i class="fa-regular fa-share-from-square"></i>
            <span class="number">12k</span>
        </div>
    </div>

</div>

</body>
</html>
